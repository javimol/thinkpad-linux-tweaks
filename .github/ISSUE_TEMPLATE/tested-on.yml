name: Tested on my laptop
description: Report whether a tool works on your machine (works or not, both help)
title: "Tested: <tool> on <laptop model>"
labels: ["test-report"]
body:
  - type: markdown
    attributes:
      value: Thanks for testing! Reports from other laptops help grow the "Works on" list.
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - gpu-toggle
        - gpu-toggle-auto (boot service)
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Did it work?
      options:
        - "Yes, fully"
        - "Partly"
        - "No"
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Output of `gpu-toggle report`
      description: |
        Run this in a terminal and paste the whole output here. It only reads system information.

        ```bash
        gpu-toggle report
        ```

        Please run it in **intel** mode (`gpu-toggle intel` first), so it shows whether the NVIDIA GPU reaches `D3cold`.
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: What happened / notes
      description: Anything that didn't work, error messages, or what you expected instead.
